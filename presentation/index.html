</style></head><body><header><strong>ALIC MEDIA</strong><span>Client presentation</span></header><main><h1>Campaign presentation</h1><p class="intro">A creative proposal by ALIC Media.</p><div class="frame" id="viewer" hidden><iframe id="deck" title="Campaign presentation" allow="fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe></div><div class="actions" id="actions" hidden><a id="open" class="button" target="_blank" rel="noopener noreferrer">Open full presentation ↗</a><span class="hint">Open the full presentation if the embedded viewer is unavailable.</span></div><p id="missing" hidden>Please use the complete presentation link provided by ALIC Media.</p><footer>ALIC Media · <a href="https://alicagency.com/">alicagency.com</a></footer></main><script>
